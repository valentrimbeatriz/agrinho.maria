<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultura Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agricultura Sustentável</h1>
        <p>Aprenda mais sobre agricultura e consumo de água</p>
    </header>

    <main>
        <section id="quiz" aria-labelledby="quiz-heading">
            <h2 id="quiz-heading">Quiz sobre Agricultura</h2>
            <div id="quiz-container"></div>
            <button type="button" id="btn-submit-quiz">Enviar Respostas</button>
            <p id="quiz-result" aria-live="polite"></p>
        </section>

        <section id="calculator" aria-labelledby="calc-heading">
            <h2 id="calc-heading">Calculadora de Água Consumida</h2>
            
            <div class="input-group">
                <label for="plantas">Número de plantas:</label>
                <input type="number" id="plantas" min="0" placeholder="Ex: 50">
            </div>
            
            <div class="input-group">
                <label for="agua">Litros de água por planta:</label>
                <input type="number" id="agua" min="0" step="0.1" placeholder="Ex: 2">
            </div>
            
            <button type="button" id="btn-calcular">Calcular</button>
            <p id="resultado" aria-live="polite"></p>
        </section>

        <section id="images" aria-labelledby="images-heading">
            <h2 id="images-heading">Imagens de Agricultura</h2>
            <div class="gallery">
                <figure>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Wheat_field.jpg" alt="Campo de trigo dourado sob o sol">
                    <figcaption>Campo de trigo</figcaption>
                </figure>
                <figure>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Rice_fields.jpg" alt="Plantação de arroz em terraços verdes">
                    <figcaption>Plantação de arroz</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Agricultura Sustentável. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
