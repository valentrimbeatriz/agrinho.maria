<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agricultura Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agricultura Sustentável</h1>
        <p>Aprenda mais sobre agricultura e consumo de água</p>
    </header>

    <section id="quiz">
        <h2>Quiz sobre Agricultura</h2>
        <div id="quiz-container"></div>
        <button onclick="submitQuiz()">Enviar Respostas</button>
        <p id="quiz-result"></p>
    </section>

    <section id="calculator">
        <h2>Calculadora de Água Consumida</h2>
        <label for="plantas">Número de plantas:</label>
        <input type="number" id="plantas" placeholder="Ex: 50">
        
        <label for="agua">Litros de água por planta:</label>
        <input type="number" id="agua" placeholder="Ex: 2">
        
        <button onclick="calcularAgua()">Calcular</button>
        <p id="resultado"></p>
    </section>

    <section id="images">
        <h2>Imagens de Agricultura</h2>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Wheat_field.jpg" alt="Campo de trigo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Rice_fields.jpg" alt="Plantação de arroz">
    </section>

    <script src="script.js"></script>
</body>
</html>
